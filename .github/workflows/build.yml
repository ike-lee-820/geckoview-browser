name: Build GeckoView Browser

# 推送即构建；用户要求「每次代码更新进行构建」，因此去重策略默认关闭（见下方 SKIP_DUP 说明）。
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write   # 创建/更新 Release 与上传 assets，使用内置 GITHUB_TOKEN，无需在仓库中存放任何 PAT。

jobs:
  build:
    # 规格要求 ubuntu-latest。注意：ubuntu-latest 于 2026-10-19 ~ 11-19 逐步迁移到 Ubuntu 26.04，
    # 镜像变更可能带来 SDK 路径/预装工具差异；若排查镜像问题，可临时改为 ubuntu-24.04 对比验证。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 修复点（本次构建失败根因）：
      # android-actions/setup-android@v3 的 action.yml 中 packages 默认值为 "tools platform-tools"，
      # main.ts 会逐个执行 sdkmanager <pkg>；旧 "tools" 包已从 Google SDK 仓库撤下，
      # sdkmanager 输出 "Failed to find package 'tools'" 并以非零码退出，导致本步骤失败、后续全部 skipped。
      # v4 声明 runs.using: node24，且默认 packages 仅为 "platform-tools"，不再安装已撤下的 tools。
      # 此处再显式声明一次 packages，避免上游默认值将来再次变化。
      # 附带说明：checkout@v4 / setup-java@v4 / upload-artifact@v4 仍声明 node20，
      # 目前被 runner 强制运行在 node24 上，只是 warning，不阻塞构建；建议后续统一升级主版本。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # ubuntu-latest 默认自带 xmllint；若 runner 镜像更换，需补充 apt-get install libxml2-utils。
      - name: Ensure xmllint
        run: |
          if ! command -v xmllint >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          fi
          xmllint --version 2>&1 | head -1 || true

      - name: Resolve latest GeckoView beta version
        id: geckoview
        run: |
          set -euo pipefail
          METADATA_URL="https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-beta-arm64-v8a/maven-metadata.xml"
          # --retry 用于抵御网络抖动与临时 5xx；不使用 Gradle "+" 动态版本，否则无法反向填充 versionName。
          curl -sSfL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 60 \
            "$METADATA_URL" -o maven-metadata.xml
          LATEST=$(xmllint --xpath 'string(metadata/versioning/latest)' maven-metadata.xml || true)
          # 备选解析（xmllint 不可用时）：LATEST=$(awk -F'[<>]' '/<latest>/{print $3}' maven-metadata.xml)
          if [ -z "$LATEST" ]; then
            LATEST=$(awk -F'[<>]' '/<latest>/{print $3}' maven-metadata.xml | head -1)
          fi
          if [ -z "$LATEST" ]; then
            echo "Failed to resolve GeckoView latest version" >&2
            exit 1
          fi

          # maven-metadata.xml 的 <latest> 可能滞后于实际可下载构建。
          # 探测对应 AAR 是否存在；404/不可下载时回退到 <release> 字段，仍失败则报错提示人工检查。
          probe_aar() {
            curl -sSfL --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 60 \
              --range 0-0 -o /dev/null "$1"
          }
          AAR_URL="https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-beta-arm64-v8a/${LATEST}/geckoview-beta-arm64-v8a-${LATEST}.aar"
          if ! probe_aar "$AAR_URL"; then
            echo "<latest> ${LATEST} 不可下载，尝试 <release> 回退" >&2
            RELEASE=$(xmllint --xpath 'string(metadata/versioning/release)' maven-metadata.xml || true)
            if [ -z "$RELEASE" ]; then
              RELEASE=$(awk -F'[<>]' '/<release>/{print $3}' maven-metadata.xml | head -1)
            fi
            if [ -z "$RELEASE" ]; then
              echo "无法回退到 <release>，请人工检查 maven-metadata.xml 与实际可下载构建" >&2
              exit 1
            fi
            AAR_URL="https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-beta-arm64-v8a/${RELEASE}/geckoview-beta-arm64-v8a-${RELEASE}.aar"
            if ! probe_aar "$AAR_URL"; then
              echo "<release> ${RELEASE} 同样不可下载，请人工检查" >&2
              exit 1
            fi
            LATEST="$RELEASE"
          fi

          echo "Resolved GeckoView beta: $LATEST"
          echo "GECKOVIEW_VERSION=$LATEST" >> "$GITHUB_ENV"
          echo "GECKOVIEW_VERSION=$LATEST" >> "$GITHUB_OUTPUT"

      # 可选去重开关（默认关闭）：
      # SKIP_DUP=false 时每次推送都构建，符合用户「每次代码更新进行构建」的要求。
      # 若改为 true，可在 tag v${GECKOVIEW_VERSION} 已存在且 assets 已有 APK 时跳过；
      # commit message 含 [force-build] 时强制重建。权衡：开启后会漏掉仅代码变更、内核版本未变的构建。
      - name: Duplicate guard (disabled by default)
        run: |
          SKIP_DUP=false
          if [ "$SKIP_DUP" = "true" ] && [ "${{ github.ref }}" = "refs/heads/main" ] \
             && ! echo "${{ github.event.head_commit.message }}" | grep -q '\[force-build\]'; then
            echo "去重开关已启用时会在此处检查 tag/assets；当前默认关闭，继续构建。"
          fi
          echo "SKIP_DUP=$SKIP_DUP" >> "$GITHUB_ENV"

      # 原工作流存在三个同名且内容完全相同的步骤，属于复制粘贴冗余，已合并为一个。
      # set -euo pipefail 保证 sdkmanager 安装失败时立即失败，不再静默继续。
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Grant gradlew executable permission
        run: chmod +x ./gradlew

      - name: Bootstrap Gradle wrapper jar
        # 仓库不二进制提交 wrapper jar，避免体积与供应链问题。
        # gradle-wrapper.properties 指向 gradle-8.13-bin.zip：AGP 8.11.1 要求最低 Gradle 8.13。
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sSfL --retry 3 --connect-timeout 20 --max-time 60 \
              -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradle/wrapper/gradle-wrapper.jar"
          fi

      - name: Build (main -> release, develop -> debug)
        run: |
          set -o pipefail
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log
          else
            ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          fi

      # 临时诊断步骤：编译失败时把日志尾部回传为 commit comment。
      # 由于外部网络策略无法直接下载 GitHub job log blob，借 api.github.com 通道取回错误详情。
      # 定位并修复编译问题后会移除本步骤。
      - name: Publish failure log (temporary diagnostics)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          body = open("build.log", encoding="utf-8", errors="replace").read() if os.path.exists("build.log") else "no build.log"
          body = "\n".join(body.splitlines()[-400:])[-60000:]
          data = json.dumps({"body": "```\n" + body + "\n```"}).encode("utf-8")
          url = "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments"
          req = urllib.request.Request(url, data=data, method="POST", headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Content-Type": "application/json",
              "Accept": "application/vnd.github+json",
              "User-Agent": "ci-diag"})
          print(urllib.request.urlopen(req, timeout=30).status)
          PY

      - name: Rename APK
        id: artifact
        run: |
          set -euo pipefail
          APK_NAME="geckoview-browser-${GECKOVIEW_VERSION}-${GITHUB_RUN_NUMBER}.apk"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            SRC="app/build/outputs/apk/release/app-release.apk"
          else
            SRC="app/build/outputs/apk/debug/app-debug.apk"
          fi
          cp "$SRC" "$APK_NAME"
          ls -lh "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: geckoview-browser-${{ steps.geckoview.outputs.GECKOVIEW_VERSION }}-${{ github.run_number }}
          path: ${{ steps.artifact.outputs.APK_NAME }}
          retention-days: 7
          if-no-files-found: error

      # 不使用 Gradle 动态版本语法（"+"），因为无法可靠反向填充 versionName；
      # versionName 直接等于 GECKOVIEW_VERSION，Gradle 侧变量为空时会显式抛 GradleException。
      - name: Create or update GitHub Release
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.geckoview.outputs.GECKOVIEW_VERSION }}
          name: GeckoView Browser ${{ steps.geckoview.outputs.GECKOVIEW_VERSION }}
          # 同名 tag 已存在时 softprops 会更新该 Release 的 assets，不会创建新 tag。
          body: |
            内核版本：GeckoView Beta ${{ steps.geckoview.outputs.GECKOVIEW_VERSION }}
            Commit：${{ github.sha }}
            构建时间：${{ github.event.head_commit.timestamp }}
            构建号：#${{ github.run_number }}
            说明：完全本地化浏览器，无云端同步；APK 使用 arm64-v8a GeckoView Beta 内核。
          files: ${{ steps.artifact.outputs.APK_NAME }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
