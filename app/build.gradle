plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

// 版本绝不硬编码：CI 由 maven-metadata.xml 的 <latest> 解析后注入。
// 不使用 Gradle "+" 动态版本语法，因为无法可靠反向填充 versionName。
def resolvedGeckoViewVersion = System.getenv("GECKOVIEW_VERSION")
if (!resolvedGeckoViewVersion) {
    throw new GradleException("GECKOVIEW_VERSION is not set. CI must resolve latest beta version first.")
}
ext {
    geckoviewArtifact = "geckoview-beta-arm64-v8a"
    geckoviewVersion = resolvedGeckoViewVersion
}

android {
    namespace "com.local.geckobrowser"
    // 最新 GeckoView Beta（160+）的 AAR metadata 要求 compileSdk >= 37。
    // compileSdk 只决定编译期可用的 API，与 targetSdk 解耦：按规格保留 targetSdk 36。
    compileSdk 37

    defaultConfig {
        applicationId "com.local.geckobrowser"
        minSdk 26
        targetSdk 36
        // versionName 必须直接等于 GECKOVIEW_VERSION，不追加后缀、不截断。
        versionName resolvedGeckoViewVersion
        versionCode System.getenv("GITHUB_RUN_NUMBER")?.toInteger() ?: 1
        ndk { abiFilters "arm64-v8a" }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "GECKOVIEW_VERSION", "\"${resolvedGeckoViewVersion}\""
        buildConfigField "String", "UPDATE_REPO", "\"ike-lee-820/geckoview-browser\""
        buildConfigField "String", "UPDATE_PROXY_BASE", "\"https://v6.gh-proxy.com/https://github.com/\""
        // versionName 绑定 GeckoView 内核版本，代码更新时不会变；用运行号判断是否有新构建。
        buildConfigField "int", "BUILD_NUMBER", "${System.getenv('GITHUB_RUN_NUMBER')?.toInteger() ?: 1}"
        // 固定签名指纹，便于核对每次构建证书一致（应用内更新覆盖安装的前提）。
        buildConfigField "String", "SIGNING_SHA256", "\"1D:39:FF:CB:0F:CF:84:9E:5B:FF:C1:15:65:18:CD:34:13:E0:4B:59:11:D3:0F:26:57:EF:26:86:3C:5E:6C:0B\""
    }

    // 【固定签名】CI 每次都是全新 runner，AGP 的 debug.keystore 会被重新随机生成。
    // 旧配置 release 复用 signingConfigs.debug，导致每次构建证书都不同，
    // 应用内更新下载后覆盖安装会因签名不一致失败。
    // 优先从环境变量 / GitHub Secrets 读取（生产环境推荐），否则回退到仓库内置固定密钥。
    signingConfigs {
        release {
            def ksPath = System.getenv("RELEASE_KEYSTORE")
            storeFile ksPath ? file(ksPath) : file("release.keystore")
            storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: "geckobrowser-local"
            keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: "geckobrowser"
            keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: "geckobrowser-local"
        }
    }

    // versionName 严格等于 GECKOVIEW_VERSION，不追加任何后缀。
    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 所有 release 构建共用同一证书，保证应用内更新可覆盖安装。
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    buildFeatures { compose true; buildConfig true }
    packaging {
        resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
        jniLibs { useLegacyPackaging = true }
    }
}

dependencies {
    // GeckoView Beta，仅 arm64-v8a；版本来自环境变量，禁止 "+" 动态版本。
    // GeckoView Beta 160 的 POM 会传递 AndroidX 2026 版（core 1.19.1 / lifecycle 2.11.0 等），
    // 其 AAR metadata 要求 AGP 9.1.0 与 compileSdk 37；本工程按规格锁定 AGP 8.x / Kotlin 2.x。
    // 排除传递依赖，由应用显式声明的 AndroidX 版本统一提供，避免依赖版本被抬升。
    implementation("org.mozilla.geckoview:geckoview-beta-arm64-v8a:${resolvedGeckoViewVersion}") {
        transitive = false
    }

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.9'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.media:media:1.7.0'

    implementation platform('androidx.compose:compose-bom:2025.03.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.4'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
