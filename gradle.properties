org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# 本地开发需显式 export GECKOVIEW_VERSION=<beta 版本>，CI 中由工作流注入；为空时 app/build.gradle 会显式失败。

# AGP 8.11.1 仅正式测试到 compileSdk 36；最新 GeckoView Beta 要求 compileSdk 37。
# 该开关允许在 AGP 8.x 下使用 compileSdk 37，targetSdk 保持 36 不变。
android.suppressUnsupportedCompileSdk=37
